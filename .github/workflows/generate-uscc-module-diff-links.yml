name: Generate USCC Module Diff Links

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - production
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  reference-diffs:
    name: Append USCC Package Diff Links
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect uschamber/* version changes and append diff links
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            // Exceptions where the repo name doesn't follow the craft-{package} pattern
            const repoExceptions = {
              'uschamber/component-library': 'USChamber/component-library',
            };

            // Dynamically resolve repo name: uschamber/{name} -> USChamber/craft-{name}
            function resolveRepo(pkg) {
              if (repoExceptions[pkg]) return repoExceptions[pkg];
              const name = pkg.replace('uschamber/', '');
              return `USChamber/craft-${name}`;
            }

            // Get composer.json from base branch
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;

            let baseComposer, headComposer;
            try {
              baseComposer = JSON.parse(execSync(`git show ${baseSha}:composer.json`).toString());
              headComposer = JSON.parse(execSync(`git show ${headSha}:composer.json`).toString());
            } catch (e) {
              core.warning('Could not read composer.json from one of the branches: ' + e.message);
              return;
            }

            const baseRequire = { ...baseComposer.require, ...baseComposer['require-dev'] };
            const headRequire = { ...headComposer.require, ...headComposer['require-dev'] };

            // Extract clean version tag from composer version string
            // e.g. "dev-fix/example-contexts as 5.16.21.1" -> "5.16.21.1"
            // e.g. "5.16.21" -> "5.16.21"
            function extractVersion(versionString) {
              if (!versionString) return null;
              const asMatch = versionString.match(/\bas\s+([\w.\-]+)$/);
              if (asMatch) return asMatch[1];
              if (versionString.startsWith('dev-')) return versionString;
              return versionString.replace(/^[^0-9]*/, '');
            }

            // Parse a semver-like string into { major, minor, patch } integers.
            // Returns null if the string doesn't look like a numeric version.
            function parseSemver(version) {
              const m = version.match(/^v?(\d+)\.(\d+)(?:\.(\d+))?/);
              if (!m) return null;
              return { major: parseInt(m[1], 10), minor: parseInt(m[2], 10), patch: parseInt(m[3] || '0', 10) };
            }

            // Returns 'major', 'minor', 'patch', or null (unparseable / no numeric bump).
            function semverBumpType(oldVer, newVer) {
              const o = parseSemver(oldVer);
              const n = parseSemver(newVer);
              if (!o || !n) return null;
              if (n.major !== o.major) return 'major';
              if (n.minor !== o.minor) return 'minor';
              return 'patch';
            }

            // Fetch up to maxCommits commit messages between two tags in a repo.
            // Returns an array of strings, or null on failure.
            async function fetchCommitMessages(repo, base, head, maxCommits = 30) {
              const [owner, repoName] = repo.split('/');
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo: repoName,
                  basehead: `${base}...${head}`,
                  per_page: maxCommits,
                });
                return comparison.data.commits
                  .slice(0, maxCommits)
                  .map(c => c.commit.message.split('\n')[0].trim())
                  .filter(Boolean);
              } catch (e) {
                core.warning(`Could not fetch commits for ${repo} ${base}...${head}: ${e.message}`);
                return null;
              }
            }

            // Call the GitHub Models API and return an AI summary string, or null on failure.
            async function fetchAiSummary(pkg, oldVer, newVer, commitMessages, githubToken) {
              const commitList = commitMessages.map(m => `- ${m}`).join('\n');
              const userPrompt =
                `The Composer package \`${pkg}\` was upgraded from version ${oldVer} to ${newVer}.\n` +
                `Here are the commit messages included in this release:\n${commitList}\n\n` +
                `Write a concise, developer-facing bullet-point summary (5 bullets max) of what changed, ` +
                `focusing on new features, breaking changes, and important fixes. ` +
                `Do not repeat the version numbers or package name in the summary.`;

              try {
                const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + githubToken,
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                      { role: 'system', content: 'You are a helpful assistant that summarizes software changelog entries for developers.' },
                      { role: 'user', content: userPrompt },
                    ],
                    max_tokens: 512,
                    temperature: 0.3,
                  }),
                });

                if (!response.ok) {
                  const text = await response.text();
                  core.warning(`GitHub Models API returned ${response.status} for ${pkg}: ${text}`);
                  return null;
                }

                const data = await response.json();
                return data.choices?.[0]?.message?.content?.trim() || null;
              } catch (e) {
                core.warning(`GitHub Models API call failed for ${pkg}: ${e.message}`);
                return null;
              }
            }

            // Fetch all release tags from a repo, sorted newest-first as returned by the API.
            // Returns an array of tag name strings, or null if the request fails.
            async function fetchReleaseTags(repo) {
              const [owner, repoName] = repo.split('/');
              try {
                const releases = await github.paginate(
                  github.rest.repos.listReleases,
                  { owner, repo: repoName, per_page: 100 },
                  (response) => response.data.map(r => r.tag_name)
                );
                return releases;
              } catch (e) {
                core.warning(`Could not fetch releases for ${repo}: ${e.message}`);
                return null;
              }
            }

            const diffLinks = [];

            // Find all uschamber/* packages across base and head
            const allPkgs = new Set([
              ...Object.keys(baseRequire),
              ...Object.keys(headRequire),
            ].filter(pkg => pkg.startsWith('uschamber/')));

            for (const pkg of allPkgs) {
              const repo = resolveRepo(pkg);
              const oldVersionRaw = baseRequire[pkg];
              const newVersionRaw = headRequire[pkg];

              if (!oldVersionRaw || !newVersionRaw) continue;
              if (oldVersionRaw === newVersionRaw) continue;

              const oldVersion = extractVersion(oldVersionRaw);
              const newVersion = extractVersion(newVersionRaw);

              if (!oldVersion || !newVersion || oldVersion === newVersion) continue;

              // Skip if either version is a dev branch with no aliased tag
              if (oldVersion.startsWith('dev-') || newVersion.startsWith('dev-')) continue;

              const compareUrl = `https://github.com/${repo}/compare/${oldVersion}...${newVersion}`;

              // Check whether more than one release sits between oldVersion and newVersion
              // by looking up the release immediately before newVersion in the API-sorted list.
              const tags = await fetchReleaseTags(repo);

              let hasIntermediateReleases = false;
              let prevTag = null;
              if (tags && tags.length > 0) {
                // tags are newest-first from the API
                const newIdx = tags.indexOf(newVersion);
                if (newIdx !== -1 && newIdx + 1 < tags.length) {
                  prevTag = tags[newIdx + 1]; // the release just before newVersion
                  if (prevTag !== oldVersion) {
                    hasIntermediateReleases = true;
                  }
                }
              }

              // Determine if this is a major or minor semver bump (warrants an AI summary)
              const bumpType = semverBumpType(oldVersion, newVersion);
              const needsAiSummary = bumpType === 'major' || bumpType === 'minor';

              // Fetch AI summary for major/minor bumps
              let aiSummaryBlock = '';
              if (needsAiSummary) {
                const commits = await fetchCommitMessages(repo, oldVersion, newVersion);
                if (commits && commits.length > 0) {
                  const summary = await fetchAiSummary(pkg, oldVersion, newVersion, commits, process.env.GITHUB_TOKEN);
                  if (summary) {
                    aiSummaryBlock = '\n  <details>\n  <summary>🤖 AI Summary</summary>\n\n' + summary + '\n  </details>';
                  }
                }
              }

              if (hasIntermediateReleases) {
                // Push two separate bullet lines so each renders on its own line
                const latestOnlyUrl = `https://github.com/${repo}/compare/${prevTag}...${newVersion}`;
                diffLinks.push(`- **${pkg}**: [\`${oldVersion} → ${newVersion}\`](${compareUrl}) _(all included releases)_${aiSummaryBlock}`);
                diffLinks.push(`- **${pkg}**: [\`${prevTag} → ${newVersion}\`](${latestOnlyUrl}) _(latest release only)_`);
              } else {
                diffLinks.push(`- **${pkg}**: [\`${oldVersion} → ${newVersion}\`](${compareUrl})${aiSummaryBlock}`);
              }
            }

            if (diffLinks.length === 0) {
              console.log('No uschamber/* package version changes detected.');
              return;
            }

            // Build the diff section content (without leading separator for replacement logic)
            const sectionContent = [
              '<!-- BEGIN USCC PACKAGE DIFFS -->',
              '##### USCC PACKAGE DIFFS',
              ...diffLinks,
              '<!-- END USCC PACKAGE DIFFS -->',
            ].join('\n');

            // Get the current PR body
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const currentBody = pr.body || '';

            // Check if USCC PACKAGE DIFFS section already exists
            const beginMarker = '<!-- BEGIN USCC PACKAGE DIFFS -->';
            const endMarker = '<!-- END USCC PACKAGE DIFFS -->';
            
            let newBody;
            if (currentBody.includes(beginMarker) && currentBody.includes(endMarker)) {
              // Replace existing section
              const beginIndex = currentBody.indexOf(beginMarker);
              const endIndex = currentBody.indexOf(endMarker) + endMarker.length;
              newBody = currentBody.substring(0, beginIndex) + sectionContent + currentBody.substring(endIndex);
            } else {
              // Append new section
              const section = [
                '',
                '---',
                sectionContent,
              ].join('\n');
              newBody = currentBody + section;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: newBody,
            });

            console.log('Updated diff links:\n' + diffLinks.join('\n'));
